size();addEventListener("resize",size);
let cur=0,t=0,run=true;

  if(!still){m.rotation.x+=m.userData.sx+.0006;m.rotation.y+=m.userData.sy+.0009;m.position.y+=Math.sin(t+m.userData.ph)*.004}
